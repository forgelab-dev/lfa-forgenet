name: Release

# À chaque fusion sur main, release-please ouvre ou met à jour la PR de version
# (CHANGELOG tiré des Conventional Commits). Fusionner cette PR crée le tag
# vX.Y.Z et la release GitHub ; l'image du serveur est alors construite pour
# amd64 et arm64, publiée sur ghcr.io, signée par cosign et accompagnée de sa
# provenance et de son SBOM. Voir docs/RELEASING.md.
#
# Les actions sont épinglées par empreinte de commit (version en commentaire) :
# ce workflow publie et signe, une étiquette déplacée ne doit rien y changer.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Écriture : joindre la fiche de release (ADR-0011).
      contents: write
      packages: write
      # Signature cosign sans clé, par le jeton OIDC de GitHub.
      id-token: write
    env:
      IMAGE: ghcr.io/forgelab-dev/forgenet-server
    steps:
      - name: Checkout du tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - name: QEMU (étape finale de l'image arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion à ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.1.0 et 0.1 ; jamais « latest » tant que ForgeNet est en alpha :
      # une installation choisit sa version (install.sh --version).
      - name: Étiquettes et labels OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
          labels: |
            org.opencontainers.image.title=ForgeNet Server
            org.opencontainers.image.licenses=Apache-2.0

      - name: Construction et publication
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Installer cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # La signature porte sur l'empreinte, pas sur l'étiquette : elle
      # couvre l'image exacte, pour chaque architecture.
      - name: Signer l'image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Vérifier la signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            > /dev/null
          echo "Signature vérifiée : ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      # La fiche désigne l'image par son empreinte : une installation qui se
      # met à jour tire exactement l'image construite et signée ici (ADR-0011).
      - name: Joindre la fiche de release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "empreinte invalide : $DIGEST"; exit 1; }
          # Les fichiers d'installation du tag, par empreinte : le moteur de mise
          # à jour les télécharge et refuse ceux qui ne correspondent pas.
          compose_sum="$(sha256sum deploy/docker-compose.yml | cut -d' ' -f1)"
          caddy_sum="$(sha256sum deploy/Caddyfile.base | cut -d' ' -f1)"
          jq -n --arg v "$VERSION" --arg i "$IMAGE" --arg d "$DIGEST" \
            --arg u "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --arg c "$compose_sum" --arg k "$caddy_sum" \
            '{schema: 1, version: $v, image: $i, digest: $d, notes_url: $u,
              files: {"docker-compose.yml": $c, "Caddyfile.base": $k}}' > forgenet-release.json
          cat forgenet-release.json
          gh release upload "$TAG" forgenet-release.json --clobber --repo "$GITHUB_REPOSITORY"
