name: CI · modules & garde-fou

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed modules by paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'pkg/gen/**'
              - 'web/src/gen/**'
              - 'mobile/lib/src/gen/**'
              - '.github/workflows/ci.yml'
            go:
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'pkg/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  buf:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Check format
        run: buf format --diff --exit-code

      - name: Lint Protobuf
        run: buf lint

      - name: Check Breaking Changes
        run: |
          if git ls-tree -r --name-only origin/main | grep -q '^api/proto/.*\.proto$'; then
            buf breaking --against 'https://github.com/forgelab-dev/lfa-forgenet.git#branch=main,subdir=api'
          else
            echo "Aucun .proto sur main : première PR du contrat, vérification ignorée."
          fi

      - name: Generate code
        run: buf generate

      - name: Check working tree clean
        working-directory: .
        run: git add -A && git diff --staged --exit-code

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint Go
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Vet, build & test (si code Go présent)
        run: |
          if git ls-files '*.go' | grep -q .; then
            go vet ./...
            go build ./...
            go test -race -count=1 ./...
          else
            echo "Aucun fichier .go suivi : vérification go list uniquement."
            go list ./...
          fi

      # Les failles connues de la bibliothèque standard et des dépendances bloquent
      # la PR : govulncheck ne signale que celles que le code peut réellement atteindre.
      - name: Vulnérabilités connues
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-save
          fi

      - name: Lint sources
        run: npx eslint src/ --no-error-on-unmatched-pattern

      - name: Check formatting
        run: npx prettier --check src/

      - name: Typecheck
        run: npx tsc --noEmit

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Flutter project presence
        id: check
        working-directory: .
        run: |
          if [ -f mobile/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Aucun pubspec.yaml sous mobile/ : projet Flutter non initialisé, job ignoré."
          fi

      - name: Setup Flutter
        if: steps.check.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        run: flutter pub get

      - name: Analyze Dart
        if: steps.check.outputs.present == 'true'
        run: flutter analyze

      - name: Check formatting
        if: steps.check.outputs.present == 'true'
        run: dart format --output=none --set-exit-if-changed .

  all-checks-pass:
    needs: [buf, go, web, mobile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks
        run: |
          echo "buf=${{ needs.buf.result }} go=${{ needs.go.result }} web=${{ needs.web.result }} mobile=${{ needs.mobile.result }}"
          fail=0
          for r in "${{ needs.buf.result }}" "${{ needs.go.result }}" "${{ needs.web.result }}" "${{ needs.mobile.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Un ou plusieurs jobs requis ont échoué."
            exit 1
          fi
          echo "All checks passed (success ou skipped)."
