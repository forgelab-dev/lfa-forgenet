name: Site

# Publie la vitrine (dossier site/) sur GitHub Pages, à forgenet.lucidforgeafrica.com,
# à chaque modification du dossier sur main. Le site est statique : aucune
# construction, le dossier est publié tel quel. Les numéros de version de la page
# sont tenus à jour par release-please, dans la PR de version.
#
# Les actions sont épinglées par empreinte de commit (version en commentaire),
# comme dans le workflow de release.

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# Une seule publication à la fois ; celle en cours va au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
