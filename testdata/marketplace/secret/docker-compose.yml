# Template d'essai partagé par le test Go (cmd/forgenet-server) et le test
# Playwright (web/e2e). La sonde de santé échoue si Compose n'a pas reçu
# APP_SECRET ; ${…:?} refuse même le fichier sans elle.
services:
  app:
    image: alpine:3.21
    command: ["sleep", "3600"]
    environment:
      APP_SECRET: ${APP_SECRET:?}
      APP_NAME: ${APP_NAME}
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$APP_SECRET\""]
      interval: 1s
      retries: 20
