syntax = "proto3";

package forgenet.v1;

option go_package = "github.com/forgelab-dev/lfa-forgenet/pkg/gen/forgenet/v1;forgenetv1";

// --- MODELS ---

// MailTLS est la protection de la liaison avec le relais (ADR-0014).
enum MailTLS {
  MAIL_TLS_UNSPECIFIED = 0;
  MAIL_TLS_STARTTLS = 1; // Port 587 : STARTTLS exigé
  MAIL_TLS_IMPLICIT = 2; // Port 465 : TLS dès la connexion
  MAIL_TLS_NONE = 3; // Relais local seulement
}

// --- REQUEST / RESPONSE MESSAGES ---

message GetMailStatusRequest {}

// GetMailStatusResponse décrit l'envoi d'e-mails. Les identifiants du relais
// ne quittent jamais le serveur : seule leur présence est dite.
message GetMailStatusResponse {
  // Faux : aucun relais n'est configuré, ForgeNet n'envoie rien.
  bool enabled = 1;
  string host = 2;
  uint32 port = 3;
  MailTLS tls = 4;
  // Expéditeur des messages, tel qu'il apparaît au destinataire.
  string from = 5;
  // Vrai : le serveur s'authentifie auprès du relais.
  bool authenticated = 6;
}

message SendTestMailRequest {}

message SendTestMailResponse {
  // Adresse du compte connecté, à qui l'e-mail d'essai est parti.
  string to = 1;
}

// --- SERVICE ---

// MailService montre l'envoi d'e-mails et l'essaie. Réservé aux
// administrateurs. Les réglages se changent sur le serveur, par install.sh
// (ADR-0014).
service MailService {
  rpc GetMailStatus(GetMailStatusRequest) returns (GetMailStatusResponse);

  // SendTestMail envoie un e-mail d'essai à l'administrateur connecté et
  // attend la réponse du relais. Sans relais : FAILED_PRECONDITION. Refus du
  // relais : FAILED_PRECONDITION avec sa réponse. Envois répétés :
  // RESOURCE_EXHAUSTED.
  rpc SendTestMail(SendTestMailRequest) returns (SendTestMailResponse);
}
