syntax = "proto3";

package forgenet.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/forgelab-dev/lfa-forgenet/pkg/gen/forgenet/v1;forgenetv1";

// --- ENUMS ---

// UserRole reprend les rôles du serveur. Un admin gère tout ; un membre
// consulte et agit dans les limites de la politique d'accès.
enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_ADMIN = 1;
  USER_ROLE_MEMBER = 2;
}

// --- MODELS ---

// User décrit le compte connecté. Le mot de passe et ses empreintes ne
// quittent jamais le serveur.
message User {
  string id = 1;
  string username = 2;
  string email = 3;
  UserRole role = 4;
}

// --- REQUEST / RESPONSE MESSAGES ---

message LoginRequest {
  // Nom d'utilisateur ou adresse e-mail.
  string login = 1;
  string password = 2;
}

message LoginResponse {
  // Jeton de session, à envoyer en « Authorization: Bearer <jeton> ».
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  User user = 3;
}

message LogoutRequest {}

message LogoutResponse {}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

// --- SERVICE ---

// AuthService ouvre et ferme les sessions du dashboard et du CLI.
service AuthService {
  // Login ouvre une session. Seule méthode appelable sans jeton ; un échec
  // répond UNAUTHENTICATED sans dire si le compte existe, et des échecs
  // répétés répondent RESOURCE_EXHAUSTED.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Logout révoque la session du jeton présenté.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // GetCurrentUser renvoie le compte du jeton présenté, avec son rôle actuel.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
}
