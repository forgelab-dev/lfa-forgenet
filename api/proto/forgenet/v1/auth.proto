syntax = "proto3";

package forgenet.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/forgelab-dev/lfa-forgenet/pkg/gen/forgenet/v1;forgenetv1";

// --- ENUMS ---

// UserRole reprend les rôles du serveur. Un admin gère tout ; un membre
// consulte et agit dans les limites de la politique d'accès.
enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_ADMIN = 1;
  USER_ROLE_MEMBER = 2;
}

// AccessLinkPurpose est l'usage d'un lien à usage unique (ADR-0014). Tous
// font choisir un mot de passe ; seuls le texte et la durée changent.
enum AccessLinkPurpose {
  ACCESS_LINK_PURPOSE_UNSPECIFIED = 0;
  // Premier accès de l'administrateur créé à l'installation (24 heures).
  ACCESS_LINK_PURPOSE_FIRST_LOGIN = 1;
  // Mot de passe oublié (1 heure).
  ACCESS_LINK_PURPOSE_PASSWORD_RESET = 2;
  // Invitation d'un membre (7 jours).
  ACCESS_LINK_PURPOSE_INVITATION = 3;
}

// --- MODELS ---

// User décrit le compte connecté. Le mot de passe et ses empreintes ne
// quittent jamais le serveur.
message User {
  string id = 1;
  string username = 2;
  string email = 3;
  UserRole role = 4;
}

// --- REQUEST / RESPONSE MESSAGES ---

message LoginRequest {
  // Nom d'utilisateur ou adresse e-mail.
  string login = 1;
  string password = 2;
}

message LoginResponse {
  // Jeton de session, à envoyer en « Authorization: Bearer <jeton> ».
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  User user = 3;
}

message LogoutRequest {}

message LogoutResponse {}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

message ChangePasswordRequest {
  // Mot de passe actuel, exigé même avec une session ouverte : un poste
  // laissé déverrouillé ne suffit pas à prendre le compte.
  string current_password = 1;
  // Nouveau mot de passe : 8 caractères au moins, 72 octets au plus (limite
  // de bcrypt), différent de l'actuel.
  string new_password = 2;
}

message ChangePasswordResponse {
  // Nombre de sessions et de jetons API du compte fermés par le changement
  // (tous sauf la session qui l'a demandé).
  int32 revoked_sessions = 1;
}

message InspectAccessLinkRequest {
  // Jeton du lien, lu dans le fragment de l'adresse (/acces#<jeton>).
  string token = 1;
}

message InspectAccessLinkResponse {
  // Compte dont le lien fait choisir le mot de passe.
  string username = 1;
  AccessLinkPurpose purpose = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message RedeemAccessLinkRequest {
  string token = 1;
  // Mot de passe choisi : 8 caractères au moins, 72 octets au plus.
  string new_password = 2;
}

message RedeemAccessLinkResponse {
  // Session ouverte sur le compte, comme après Login.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  User user = 3;
}

message GetLoginOptionsRequest {}

message GetLoginOptionsResponse {
  // Vrai quand le serveur peut envoyer un lien « mot de passe oublié » :
  // l'écran de connexion propose alors le lien, sinon il renvoie à la
  // commande « forgenet user set-password » sur le serveur.
  bool password_reset = 1;
}

message RequestPasswordResetRequest {
  // Nom d'utilisateur ou adresse e-mail, comme pour Login.
  string login = 1;
}

message RequestPasswordResetResponse {}

// --- SERVICE ---

// AuthService ouvre et ferme les sessions du dashboard et du CLI.
service AuthService {
  // Login ouvre une session. Seule méthode appelable sans jeton ; un échec
  // répond UNAUTHENTICATED sans dire si le compte existe, et des échecs
  // répétés répondent RESOURCE_EXHAUSTED.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Logout révoque la session du jeton présenté.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // GetCurrentUser renvoie le compte du jeton présenté, avec son rôle actuel.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);

  // ChangePassword change le mot de passe du compte connecté, puis ferme ses
  // autres sessions et jetons. Un mot de passe actuel incorrect ou un nouveau
  // mot de passe refusé répond INVALID_ARGUMENT (jamais UNAUTHENTICATED, qui
  // fermerait la session du demandeur) ; des échecs répétés répondent
  // RESOURCE_EXHAUSTED. Le changement est inscrit au journal d'audit.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // InspectAccessLink décrit un lien à usage unique encore valable, sans
  // l'utiliser : la page dit pour quel compte on choisit un mot de passe.
  // Appelable sans jeton. Un lien inconnu, expiré, déjà utilisé ou remplacé
  // répond NOT_FOUND, sans dire lequel.
  rpc InspectAccessLink(InspectAccessLinkRequest) returns (InspectAccessLinkResponse);

  // RedeemAccessLink utilise le lien : il fixe le mot de passe choisi, ferme
  // les sessions et jetons du compte, puis ouvre une session. Appelable sans
  // jeton. Un lien qui ne vaut plus répond NOT_FOUND ; un mot de passe refusé
  // répond INVALID_ARGUMENT et laisse le lien valable. L'usage est inscrit au
  // journal d'audit.
  rpc RedeemAccessLink(RedeemAccessLinkRequest) returns (RedeemAccessLinkResponse);

  // GetLoginOptions dit ce que l'écran de connexion peut proposer. Appelable
  // sans jeton ; ne révèle rien du relais ni des comptes.
  rpc GetLoginOptions(GetLoginOptionsRequest) returns (GetLoginOptionsResponse);

  // RequestPasswordReset envoie, si un compte correspond, un lien pour
  // choisir un nouveau mot de passe (1 heure). Appelable sans jeton. La
  // réponse est la même, et dans le même délai, qu'un compte corresponde ou
  // non : la recherche et l'envoi se font en tâche de fond. Sans relais SMTP,
  // répond FAILED_PRECONDITION ; trop de demandes depuis une même adresse
  // publique répondent RESOURCE_EXHAUSTED. Au-delà de 5 demandes par heure
  // pour un compte, les suivantes sont ignorées sans le dire.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
}
